name: Prevent environment files in Git

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  prevent-env-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check tracked files and reachable history
        run: |
          node scripts/check-env-tracking.mjs
          node scripts/check-env-tracking.mjs --history
